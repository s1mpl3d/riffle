<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riffle mini player</title>
  <link rel="stylesheet" href="mini.css">
</head>
<body>
  <div class="mini" id="mini">
    <div class="mini-backdrop">
      <img id="backdrop-a" alt="">
      <img id="backdrop-b" alt="">
    </div>
    <div class="mini-tint"></div>

    <div class="mini-cover">
      <img id="cover" alt="">
      <div class="mini-cover-fallback" id="cover-fallback">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
      </div>
    </div>

    <div class="mini-body">
      <div class="mini-text">
        <div class="mini-title-wrap"><span class="mini-title" id="title">Nothing playing</span></div>
        <div class="mini-artist-row">
          <span class="mini-eq" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="mini-artist" id="artist">Riffle</span>
        </div>
      </div>

      <div class="mini-progress-row">
        <span class="mini-time" id="time-cur">0:00</span>
        <div class="mini-progress" id="progress">
          <div class="mini-progress-fill" id="progress-fill"><span class="mini-progress-knob"></span></div>
        </div>
        <span class="mini-time" id="time-dur">0:00</span>
      </div>
    </div>

    <div class="mini-controls">
      <button class="mini-btn" data-cmd="prev" title="Previous">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="mini-btn mini-play" data-cmd="toggle" title="Play / pause">
        <svg class="icon-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14z"/></svg>
        <svg class="icon-pause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.4"/><rect x="14" y="5" width="4" height="14" rx="1.4"/></svg>
      </button>
      <button class="mini-btn" data-cmd="next" title="Next">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>

    <div class="mini-corner">
      <button class="mini-chip" id="btn-fav" data-cmd="favorite" title="Favorite">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>
      </button>
      <button class="mini-chip" data-cmd="expand" title="Open Riffle">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      </button>
      <button class="mini-chip" data-cmd="close" title="Close mini player">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script src="mini.js"></script>
</body>
</html>
