    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="6">
      <circle r="232"/>
      <circle r="198"/>
      <circle r="164"/>
    </g>
    <path d="M -190 -190 A 268 268 0 0 1 190 -190 L 0 0 Z" fill="url(#sheen)"/>
    <circle r="112" fill="url(#label)"/>
    <circle r="20" fill="#150E2E"/>
  </g>
