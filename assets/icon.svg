  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>

  <!-- records fanned out, like flipping through a crate -->
  <circle cx="352" cy="512" r="236" fill="#2B1B5C" opacity="0.45"/>
  <circle cx="440" cy="512" r="248" fill="#21164A" opacity="0.75"/>

  <g transform="translate(560 512)">
